<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuickBasket - Admin Panel</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { margin: 0; background: #f4f6f8; color: #222; }
    header { background: #087a43; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
    header h2 { margin: 0; font-size: 19px; }
    .container { max-width: 900px; margin: 20px auto; padding: 0 15px; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px; }
    input, select, button { width: 100%; padding: 10px; margin: 8px 0; border-radius: 8px; border: 1px solid #ccc; font-size: 15px; }
    button { background: #087a43; color: white; border: none; font-weight: bold; cursor: pointer; }
    button:hover { background: #0a693b; }
    .btn-danger { background: #dc2626; width: auto; padding: 6px 12px; font-size: 13px; }
    .btn-top { background: #111; color: white; text-decoration: none; width: auto; padding: 8px 12px; border-radius: 8px; font-size: 13px; font-weight: bold; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
    .item-card { border: 1px solid #e5e7eb; padding: 12px; border-radius: 10px; background: #fafafa; }
    .item-card img { width: 100%; height: 120px; object-fit: cover; border-radius: 8px; background: #eee; }
    .order-card { border-left: 4px solid #087a43; background: #f9fafb; padding: 12px; margin-bottom: 10px; border-radius: 8px; }
    .hidden { display: none; }
  </style>
</head>
<body>

<header>
  <h2>🛒 QuickBasket Admin</h2>
  <div style="display:flex; gap:8px;">
    <a href="index.html" class="btn-top">⬅ Back to Store</a>
    <button type="button" id="logoutBtn" class="btn-top hidden">Logout</button>
  </div>
</header>

<div class="container">
  <div id="loginBox" class="card" style="max-width: 400px; margin: 50px auto;">
    <h3>Admin Login</h3>
    <input type="email" id="adminEmail" placeholder="Admin Email" required />
    <input type="password" id="adminPass" placeholder="Password" required />
    <button type="button" id="loginBtn">Login to Dashboard</button>
    <p id="loginError" style="color: red; font-size: 14px; margin-top: 8px;"></p>
  </div>

  <div id="dashboard" class="hidden">
    <div class="card">
      <h3>➕ Add New Product (With Real Photo)</h3>
      <input type="text" id="pName" placeholder="Product Name (e.g., Amul Butter 100g)" />
      <input type="text" id="pBrand" placeholder="Company / Brand (e.g., Amul, Lay's, QuickBasket)" />
      <input type="number" id="pPrice" placeholder="Selling Price in ₹ (e.g., 58)" />
      <input type="number" id="pMrp" placeholder="MRP in ₹ (optional, e.g., 60)" />
      <input type="text" id="pUnit" placeholder="Unit / Weight (e.g., 100 g, 1 L, 1 Pack)" />
      <select id="pCategory">
        <option value="Daily Grocery">Daily Grocery</option>
        <option value="Snacks & Branded">Snacks & Branded</option>
        <option value="Vegetables & Fruits">Veg & Fruits</option>
        <option value="Dairy & Bread">Milk, Dairy & Eggs</option>
        <option value="Drinks & Beverages">Cold Drinks & Tea</option>
        <option value="Instant Food">Maggi & Instant</option>
        <option value="Medicine & Wellness">Medicine & Wellness</option>
        <option value="Condoms & Intimate Care">Condoms & Pads</option>
        <option value="Home Appliances">Home Appliances</option>
        <option value="Household & Care">Bath, Cleaning & Home</option>
      </select>
      <label style="font-size:13px; color:#444; font-weight:600; display:block; margin-top:6px;">📸 Select Photo from Gallery / Computer:</label>
      <input type="file" id="pFile" accept="image/*" />
      <button type="button" id="addProductBtn">Add Product to Store</button>
    </div>

    <div class="card">
      <h3>📦 Live Customer Orders</h3>
      <div id="ordersList">Loading orders...</div>
    </div>

    <div class="card">
      <h3>📋 Your Added Custom Products</h3>
      <div id="productsList" class="grid">Loading products...</div>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD4K3a8LwxI7pV2I075I4t_PrxDcGfU",
    authDomain: "quickbasket-d2032.firebaseapp.com",
    projectId: "quickbasket-d2032",
    storageBucket: "quickbasket-d2032.firebasestorage.app",
    messagingSenderId: "9960307687",
    appId: "1:9960307687:web:7d024c34a76223b1c8669",
    measurementId: "G-8RSX064362"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const loginBox = document.getElementById("loginBox");
  const dashboard = document.getElementById("dashboard");
  const logoutBtn = document.getElementById("logoutBtn");
  const loginBtn = document.getElementById("loginBtn");
  const loginError = document.getElementById("loginError");

  loginBtn.addEventListener("click", async () => {
    const email = document.getElementById("adminEmail").value.trim();
    const pass = document.getElementById("adminPass").value;
    loginError.innerText = "";

    if (!email || !pass) return (loginError.innerText = "Email aur password dono daalein!");

    loginBtn.disabled = true;
    loginBtn.innerText = "Logging in...";

    try {
      await signInWithEmailAndPassword(auth, email, pass);
    } catch (err) {
      loginError.innerText = "Login Failed: " + err.message;
    } finally {
      loginBtn.disabled = false;
      loginBtn.innerText = "Login to Dashboard";
    }
  });

  logoutBtn.addEventListener("click", () => signOut(auth));

  onAuthStateChanged(auth, (user) => {
    if (user) {
      loginBox.classList.add("hidden");
      dashboard.classList.remove("hidden");
      logoutBtn.classList.remove("hidden");
      loadProducts();
      loadOrders();
    } else {
      loginBox.classList.remove("hidden");
      dashboard.classList.add("hidden");
      logoutBtn.classList.add("hidden");
    }
  });

  function compressImage(file) {
    return new Promise((resolve) => {
      if (!file) return resolve("");
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement("canvas");
          const maxW = 350;
          const scale = maxW / img.width;
          canvas.width = maxW;
          canvas.height = img.height * scale;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL("image/jpeg", 0.75));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  document.getElementById("addProductBtn").addEventListener("click", async () => {
    const name = document.getElementById("pName").value.trim();
    const brand = document.getElementById("pBrand").value.trim() || "QuickBasket";
    const price = Number(document.getElementById("pPrice").value);
    const mrp = Number(document.getElementById("pMrp").value) || price;
    const unit = document.getElementById("pUnit").value.trim();
    const category = document.getElementById("pCategory").value;
    const file = document.getElementById("pFile").files[0];

    if (!name || !price) return alert("Product name aur price zaroori hai!");

    const btn = document.getElementById("addProductBtn");
    btn.disabled = true;
    btn.innerText = "Adding Product...";

    try {
      const image = await compressImage(file);
      await addDoc(collection(db, "products"), { name, brand, price, mrp, unit, category, image, createdAt: Date.now() });
      document.getElementById("pName").value = "";
      document.getElementById("pBrand").value = "";
      document.getElementById("pPrice").value = "";
      document.getElementById("pMrp").value = "";
      document.getElementById("pUnit").value = "";
      document.getElementById("pFile").value = "";
      alert("✅ Product added with photo!");
    } catch (err) {
      alert("Error: " + err.message);
    } finally {
      btn.disabled = false;
      btn.innerText = "Add Product to Store";
    }
  });

  function loadProducts() {
    onSnapshot(collection(db, "products"), (snap) => {
      const list = document.getElementById("productsList");
      if (snap.empty) { list.innerHTML = "<p>Abhi koi custom product add nahi kiya gaya hai.</p>"; return; }
      list.innerHTML = "";
      snap.forEach((docSnap) => {
        const p = docSnap.data();
        const div = document.createElement("div");
        div.className = "item-card";
        div.innerHTML = `
          <img src="${p.image || 'https://placehold.co/300x200?text=QuickBasket'}" alt="${p.name}" />
          <h4>${p.name}</h4>
          <p>${p.unit || ""} • <b>₹${p.price}</b></p>
          <small>${p.brand || ''} • ${p.category}</small><br><br>
          <button type="button" class="btn-danger" onclick="deleteProduct('${docSnap.id}')">Delete</button>
        `;
        list.appendChild(div);
      });
    });
  }

  window.deleteProduct = async (id) => {
    if (confirm("Delete this product?")) await deleteDoc(doc(db, "products", id));
  };

  function loadOrders() {
    const q = query(collection(db, "orders"), orderBy("createdAt", "desc"));
    onSnapshot(q, (snap) => {
      const list = document.getElementById("ordersList");
      if (snap.empty) { list.innerHTML = "<p>Abhi koi order nahi aaya hai.</p>"; return; }
      list.innerHTML = "";
      snap.forEach((docSnap) => {
        const o = docSnap.data();
        const itemsText = o.items.map(i => `${i.name} (x${i.qty || i.quantity || 1})`).join(", ");
        const div = document.createElement("div");
        div.className = "order-card";
        div.innerHTML = `
          <b>Customer:</b> ${o.customerName} | 📞 ${o.phone}<br>
          <b>Address:</b> ${o.address}<br>
          <b>Items:</b> ${itemsText}<br>
          <b>Total:</b> ₹${o.total} | <b>Status:</b> ${o.status || "Pending"}<br><br>
          <button type="button" style="width:auto; padding:5px 10px; font-size:13px;" onclick="markDelivered('${docSnap.id}')">Mark Delivered ✅</button>
        `;
        list.appendChild(div);
      });
    });
  }

  window.markDelivered = async (id) => {
    await updateDoc(doc(db, "orders", id), { status: "Delivered ✅" });
  };
</script>
</body>
</html>
