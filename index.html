<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuickBasket - Fast Local Grocery Delivery</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Header -->
  <header class="navbar">
    <div class="brand">
      <img src="logo.png" alt="QuickBasket Logo" onerror="this.style.display='none'" />
      <div>
        <h1>QuickBasket</h1>
        <span>⚡ Fast Local Delivery • Brahmapuri</span>
      </div>
    </div>
    <button id="openCartBtn" class="cart-btn">
      🛒 Cart (<span id="cartCount">0</span>) • ₹<span id="cartTotalTop">0</span>
    </button>
  </header>

  <!-- Search & Categories -->
  <section class="controls">
    <input type="text" id="searchInput" placeholder="🔍 Search Atta, Milk, Vegetables, Snacks..." />
    <div class="categories" id="categoryBar">
      <button class="cat-btn active" data-cat="All">All</button>
      <button class="cat-btn" data-cat="Groceries">Groceries & Staples</button>
      <button class="cat-btn" data-cat="Vegetables">Fruits & Vegetables</button>
      <button class="cat-btn" data-cat="Dairy">Dairy & Bakery</button>
      <button class="cat-btn" data-cat="Snacks">Snacks & Beverages</button>
      <button class="cat-btn" data-cat="Personal Care">Personal & Home Care</button>
    </div>
  </section>

  <!-- Products Grid -->
  <main class="container">
    <div id="storeProducts" class="product-grid">Loading store items...</div>
  </main>

  <!-- Cart & Checkout Modal -->
  <div id="cartModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3>🛒 Your Basket</h3>
        <button id="closeCartBtn" class="close-btn">✖</button>
      </div>
      <div id="cartItemsList" class="cart-items"></div>
      <div class="cart-summary">
        <h4>Total Payable: ₹<span id="cartTotalModal">0</span></h4>
      </div>

      <form id="checkoutForm" class="checkout-form">
        <h4>Delivery Details (Cash on Delivery / UPI on Delivery)</h4>
        <input type="text" id="custName" placeholder="Your Full Name" required />
        <input type="tel" id="custPhone" placeholder="Mobile Number (10 digits)" required />
        <textarea id="custAddress" rows="2" placeholder="Full Address / Mohalla / Landmark" required></textarea>
        <button type="submit" id="placeOrderBtn" class="order-submit-btn">Place Order Now ✅</button>
      </form>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, onSnapshot, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD4K3a8LwxI7pV2I075I4t_PrxDcGfU",
      authDomain: "quickbasket-d2032.firebaseapp.com",
      projectId: "quickbasket-d2032",
      storageBucket: "quickbasket-d2032.firebasestorage.app",
      messagingSenderId: "9960307687",
      appId: "1:9960307687:web:7d024c34a76223b1c8669",
      measurementId: "G-8RSX064362"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let allProducts = [];
    let cart = [];
    let selectedCategory = "All";

    // Fetch Live Products from Firestore
    onSnapshot(collection(db, "products"), (snap) => {
      allProducts = [];
      snap.forEach((doc) => allProducts.push({ id: doc.id, ...doc.data() }));
      renderProducts();
    });

    function renderProducts() {
      const search = document.getElementById("searchInput").value.toLowerCase();
      const container = document.getElementById("storeProducts");
      container.innerHTML = "";

      const filtered = allProducts.filter((p) => {
        const matchCat = selectedCategory === "All" || p.category === selectedCategory;
        const matchSearch = p.name.toLowerCase().includes(search);
        return matchCat && matchSearch;
      });

      if (filtered.length === 0) {
        container.innerHTML = "<p>Abhi koi item nahi hai. Admin panel se products add karein!</p>";
        return;
      }

      filtered.forEach((p) => {
        const card = document.createElement("div");
        card.className = "p-card";
        card.innerHTML = `
          <img src="${p.image}" alt="${p.name}" />
          <h4>${p.name}</h4>
          <div class="p-unit">${p.unit || ""}</div>
          <div class="p-bottom">
            <span class="p-price">₹${p.price}</span>
            <button class="add-btn" onclick="addToCart('${p.id}')">+ ADD</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Search & Category Filters
    document.getElementById("searchInput").addEventListener("input", renderProducts);
    document.querySelectorAll(".cat-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".cat-btn").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        selectedCategory = btn.dataset.cat;
        renderProducts();
      });
    });

    // Cart Logic
    window.addToCart = (id) => {
      const product = allProducts.find((p) => p.id === id);
      const existing = cart.find((item) => item.id === id);
      if (existing) existing.qty += 1;
      else cart.push({ ...product, qty: 1 });
      updateCartUI();
    };

    window.changeQty = (id, delta) => {
      const item = cart.find((i) => i.id === id);
      if (!item) return;
      item.qty += delta;
      if (item.qty <= 0) cart = cart.filter((i) => i.id !== id);
      updateCartUI();
    };

    function updateCartUI() {
      const count = cart.reduce((sum, i) => sum + i.qty, 0);
      const total = cart.reduce((sum, i) => sum + i.price * i.qty, 0);
      document.getElementById("cartCount").innerText = count;
      document.getElementById("cartTotalTop").innerText = total;
      document.getElementById("cartTotalModal").innerText = total;

      const list = document.getElementById("cartItemsList");
      if (cart.length === 0) {
        list.innerHTML = "<p>Aapka basket khaali hai.</p>";
        return;
      }

      list.innerHTML = cart.map((item) => `
        <div class="cart-item">
          <div>
            <b>${item.name}</b><br>
            <small>₹${item.price} x ${item.qty} = ₹${item.price * item.qty}</small>
          </div>
          <div class="qty-box">
            <button onclick="changeQty('${item.id}', -1)">-</button>
            <span style="margin:0 8px;">${item.qty}</span>
            <button onclick="changeQty('${item.id}', 1)">+</button>
          </div>
        </div>
      `).join("");
    }

    // Modal Open/Close
    const modal = document.getElementById("cartModal");
    document.getElementById("openCartBtn").onclick = () => { updateCartUI(); modal.classList.remove("hidden"); };
    document.getElementById("closeCartBtn").onclick = () => modal.classList.add("hidden");

    // Place Order to Firestore
    document.getElementById("checkoutForm").onsubmit = async (e) => {
      e.preventDefault();
      if (cart.length === 0) return alert("Pehle cart mein kuch items add karein!");

      const customerName = document.getElementById("custName").value.trim();
      const phone = document.getElementById("custPhone").value.trim();
      const address = document.getElementById("custAddress").value.trim();
      const total = cart.reduce((sum, i) => sum + i.price * i.qty, 0);

      const btn = document.getElementById("placeOrderBtn");
      btn.disabled = true;
      btn.innerText = "Placing Order...";

      try {
        await addDoc(collection(db, "orders"), {
          customerName,
          phone,
          address,
          items: cart.map(({ id, name, price, qty }) => ({ id, name, price, qty })),
          total,
          status: "Pending",
          createdAt: Date.now()
        });
        alert("🎉 Order Placed Successfully! QuickBasket team jald hi deliver karegi.");
        cart = [];
        updateCartUI();
        document.getElementById("checkoutForm").reset();
        modal.classList.add("hidden");
      } catch (err) {
        alert("Error placing order: " + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "Place Order Now ✅";
      }
    };
  </script>
</body>
</html>
